[project]
name = "geo-explorer-mcp"
version = "0.1.0"
description = "MCP server serving country facts, administrative boundaries and regional statistics, so an AI can build interactive geography from structured data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "arnienemeth", email = "arni.nemeth@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "geography", "geojson", "wikidata", "maps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
geo-explorer-mcp = "geo_explorer_mcp:main"

[project.urls]
Homepage = "https://github.com/arnienemeth/geo-explorer-mcp"
Repository = "https://github.com/arnienemeth/geo-explorer-mcp"
Issues = "https://github.com/arnienemeth/geo-explorer-mcp/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
